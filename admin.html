<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechBox Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f9fc;
}

.navbar{
    background:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo img{
    height:55px;
}

.logout-btn{
    border:none;
    background:#19afe9;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    padding:30px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h3{
    color:#666;
    margin-bottom:10px;
}

.card h1{
    color:#19afe9;
}

.section{
    background:white;
    padding:25px;
    border-radius:16px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.section h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

input,textarea{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    border:none;
    background:#19afe9;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>
<body>

<nav class="navbar">

    <div class="logo">
        <img src="logo.png">
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</nav>

<div class="container">
<div class="container">

    <div class="stats">

        <div class="card">
            <h3>Users</h3>
            <h1 id="usersCount">0</h1>
        </div>

        <div class="card">
            <h3>Services</h3>
            <h1 id="servicesCount">0</h1>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <h1 id="ordersCount">0</h1>
        </div>

        <div class="card">
            <h3>Premium Users</h3>
            <h1 id="premiumCount">0</h1>
        </div>

    </div>

    <div class="section">

        <h2>Add Service</h2>

        <input
            id="title"
            placeholder="Service Title"
        >

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

        <input
            id="price"
            placeholder="Price"
        >

        <input
            id="billing"
            placeholder="Billing Type"
        >

        <input
            id="image"
            placeholder="Image URL"
        >

        <button onclick="addService()">
            Add Service
        </button>

    </div>

    <div class="section">

        <h2>Services</h2>

        <table>

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Billing</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="servicesTable">
            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>Orders</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Status</th>
                    <th>Save</th>
                </tr>
            </thead>

            <tbody id="ordersTable">
            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>Users</h2>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody id="usersTable">
            </tbody>

        </table>

    </div>

</div>

<script>

const API =
"https://techbox-backend-usi4.onrender.com";

const token =
localStorage.getItem("token");

if(!token){
    window.location.href =
    "login.html";
}

async function loadStats(){

    try{

        const res =
        await fetch(
            API + "/api/admin/stats",
            {
                headers:{
                    Authorization:
                    "Bearer " + token
                }
            }
        );

        const data =
        await res.json();

        document.getElementById(
            "usersCount"
        ).innerText =
        data.users || 0;

        document.getElementById(
            "servicesCount"
        ).innerText =
        data.services || 0;

        document.getElementById(
            "ordersCount"
        ).innerText =
        data.orders || 0;

        document.getElementById(
            "premiumCount"
        ).innerText =
        data.premiumUsers || 0;

    }
    catch(error){
        console.log(error);
    }
}

async function loadUsers(){

    try{

        const res =
        await fetch(
            API + "/api/admin/users",
            {
                headers:{
                    Authorization:
                    "Bearer " + token
                }
            }
        );

        const data =
        await res.json();

        let html = "";

        data.users.forEach(user => {

            html += `
            <tr>
                <td>${user.name || ""}</td>
                <td>${user.email || ""}</td>
                <td>${user.role || "user"}</td>
            </tr>
            `;

        });

        document.getElementById(
            "usersTable"
        ).innerHTML = html;

    }
    catch(error){
        console.log(error);
    }
}

async function loadOrders(){

    try{

        const res =
        await fetch(
            API + "/api/admin/orders",
            {
                headers:{
                    Authorization:
                    "Bearer " + token
                }
            }
        );

        const data =
        await res.json();

        let html = "";

        data.orders.forEach(order => {

            html += `
            <tr>

                <td>${order.id}</td>

                <td>

                    <select
                    id="status-${order.id}">

                        <option
                        ${order.status==="Pending"?"selected":""}>
                        Pending
                        </option>

                        <option
                        ${order.status==="In Progress"?"selected":""}>
                        In Progress
                        </option>

                        <option
                        ${order.status==="Completed"?"selected":""}>
                        Completed
                        </option>

                        <option
                        ${order.status==="Cancelled"?"selected":""}>
                        Cancelled
                        </option>

                    </select>

                </td>

                <td>

                    <button
                    onclick="updateOrder('${order.id}')">

                    Save

                    </button>

                </td>

            </tr>
            `;

        });

        document.getElementById(
            "ordersTable"
        ).innerHTML = html;

    }
    catch(error){
        console.log(error);
    }
}

async function updateOrder(id){

    const status =
    document.getElementById(
        "status-" + id
    ).value;

    try{

        await fetch(
            API + "/api/orders/" + id,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    status
                })
            }
        );

        alert(
            "Order Updated"
        );

        loadOrders();

    }
    catch(error){

        alert(
            "Update Failed"
        );

    }
}

async function loadServices(){

    try{

        const res =
        await fetch(
            API + "/api/services"
        );

        const data =
        await res.json();

        let html = "";

        data.services.forEach(service => {

            html += `
            <tr>

                <td>${service.title}</td>

                <td>₹${service.price}</td>

                <td>${service.billing_type}</td>

                <td>

                    <button
                    onclick="deleteService('${service.id}')">

                    Delete

                    </button>

                </td>

            </tr>
            `;

        });

        document.getElementById(
            "servicesTable"
        ).innerHTML = html;

    }
    catch(error){
        console.log(error);
    }
}

async function addService(){

    const title =
    document.getElementById(
        "title"
    ).value;

    const description =
    document.getElementById(
        "description"
    ).value;

    const price =
    document.getElementById(
        "price"
    ).value;

    const billing_type =
    document.getElementById(
        "billing"
    ).value;

    const image =
    document.getElementById(
        "image"
    ).value;

    try{

        const res =
        await fetch(
            API + "/api/services",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    title,
                    description,
                    price,
                    billing_type,
                    image
                })
            }
        );

        const data =
        await res.json();

        alert(
            data.message ||
            "Service Added"
        );

        document.getElementById("title").value="";
        document.getElementById("description").value="";
        document.getElementById("price").value="";
        document.getElementById("billing").value="";
        document.getElementById("image").value="";

        loadServices();
        loadStats();

    }
    catch(error){

        alert(
            "Failed"
        );

    }
}

async function deleteService(id){

    if(
        !confirm(
            "Delete this service?"
        )
    ){
        return;
    }

    try{

        await fetch(
            API + "/api/services/" + id,
            {
                method:"DELETE"
            }
        );

        alert(
            "Service Deleted"
        );

        loadServices();
        loadStats();

    }
    catch(error){

        alert(
            "Delete Failed"
        );

    }
}

function logout(){

    localStorage.removeItem(
        "token"
    );

    window.location.href =
    "login.html";
}

loadStats();
loadUsers();
loadOrders();
loadServices();

</script>
</body>
</html>
