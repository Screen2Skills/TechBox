<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechBox - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    background:
    linear-gradient(
        135deg,
        #f5fcff 0%,
        #ffffff 55%,
        #eefaff 100%
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.card{
    width:100%;
    max-width:500px;

    background:#ffffff;

    padding:35px;

    border-radius:20px;

    border:1px solid #dff5ff;

    box-shadow:
    0 15px 45px rgba(0,150,210,.12);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    max-width:100%;
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#111;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #dceef6;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#19afe9;
}

button{
    width:100%;
    border:none;
    background:#19afe9;
    color:#ffffff;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#0d9ddb;
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    min-height:24px;
}

.success{
    color:green;
}

.error{
    color:#d93025;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#19afe9;
    text-decoration:none;
    font-weight:bold;
}

.links div{
    margin-top:10px;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">
        <img src="logo.png" alt="TechBox">
    </div>

    <h2>Welcome Back</h2>

    <input
        type="email"
        id="email"
        placeholder="Email Address"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginBtn">
        Login
    </button>

    <p
        class="message"
        id="message"
    ></p>

    <div class="links">

        <div>
            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </div>

        <div>
            Don't have an account?
            <a href="signup.html">
                Sign Up
            </a>
        </div>

    </div>

</div>

<script>

const API =
"https://techbox-backend-usi4.onrender.com/api/auth";

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

function showMessage(text, success = false){

    message.textContent = text;

    if(success){
        message.className =
        "message success";
    }else{
        message.className =
        "message error";
    }
}

loginBtn.addEventListener(
"click",
async () => {

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value;

    if(!email || !password){

        showMessage(
            "Please fill all fields"
        );

        return;
    }

    try{

        loginBtn.disabled = true;
        loginBtn.textContent =
        "Logging In...";

        const res =
        await fetch(
            API + "/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data =
        await res.json();

        showMessage(
            data.message,
            data.success
        );

        if(data.success){

            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            setTimeout(() => {

                window.location.href =
                "dashboard.html";

            }, 1000);
        }

    }
    catch(error){

        showMessage(
            "Network error"
        );

    }
    finally{

        loginBtn.disabled = false;
        loginBtn.textContent =
        "Login";

    }

});

</script>

</body>
</html>
