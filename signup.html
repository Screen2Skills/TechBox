<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechBox - Sign Up</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.65),
        rgba(0,0,0,.65)
    ),
    url("b1.png");

    background-size:cover;
    background-position:center;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.card{
    width:100%;
    max-width:500px;

    background:#ffffff;

    padding:35px;

    border-radius:20px;

    box-shadow:
    0 15px 45px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    max-width:100%;
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#111;
}

input{
    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid #dceef6;

    border-radius:10px;

    font-size:16px;

    outline:none;
}

input:focus{
    border-color:#19afe9;
}

button{
    width:100%;

    border:none;

    background:#19afe9;

    color:#ffffff;

    padding:14px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:#0d9ddb;
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.secondary{
    margin-top:10px;
}

.message{
    margin-top:15px;

    text-align:center;

    font-weight:bold;

    min-height:24px;
}

.success{
    color:green;
}

.error{
    color:red;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    color:#19afe9;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">
        <img src="logo.png" alt="TechBox">
    </div>

    <h2>Create Account</h2>

    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email Address"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="sendOtpBtn">
        Send OTP
    </button>

    <input
        type="text"
        id="otp"
        placeholder="Enter OTP"
    >

    <button
        class="secondary"
        id="signupBtn"
    >
        Create Account
    </button>

    <p
        class="message"
        id="message"
    ></p>

    <div class="footer">
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </div>

</div>

<script>
let cooldown = false;
const API =
"https://techbox-backend-usi4.onrender.com/api/auth";

const message =
document.getElementById("message");

const sendOtpBtn =
document.getElementById("sendOtpBtn");

const signupBtn =
document.getElementById("signupBtn");

function showMessage(text, success = false){

    message.textContent = text;

    if(success){
        message.className =
        "message success";
    }
    else{
        message.className =
        "message error";
    }
}


// ======================
// SEND OTP
// ======================
sendOtpBtn.addEventListener(
"click",
async () => {

    if(cooldown){
        showMessage(
            "Please wait before requesting another OTP"
        );
        return;
    }

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const emailRegex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailRegex.test(email)){
        showMessage(
            "Enter a valid email"
        );
        return;
    }

    try{

        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent =
        "Sending...";

        const res =
        await fetch(
            API + "/send-otp",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    email
                })
            }
        );

        const data =
        await res.json();

        showMessage(
            data.message,
            data.success
        );

        if(data.success){

            cooldown = true;

            let seconds = 60;

            const timer =
            setInterval(() => {

                sendOtpBtn.textContent =
                `Wait ${seconds}s`;

                seconds--;

                if(seconds < 0){

                    clearInterval(timer);

                    cooldown = false;

                    sendOtpBtn.disabled = false;

                    sendOtpBtn.textContent =
                    "Send OTP";
                }

            },1000);

            return;
        }

    }
    catch(error){

        showMessage(
            "Network error"
        );

    }

    sendOtpBtn.disabled = false;
    sendOtpBtn.textContent =
    "Send OTP";

});


// ======================
// SIGNUP
// ======================
signupBtn.addEventListener(
"click",
async () => {

    const name =
    document
    .getElementById("name")
    .value
    .trim();

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value;

    const otp =
    document
    .getElementById("otp")
    .value
    .trim();

    if(
        !name ||
        !email ||
        !password ||
        !otp
    ){
        showMessage(
            "Please fill all fields"
        );
        return;
    }

    if(name.length < 2){
        showMessage(
            "Enter a valid name"
        );
        return;
    }

    if(
        !/^[a-zA-Z\s]+$/.test(name)
    ){
        showMessage(
            "Name can only contain letters"
        );
        return;
    }

    const emailRegex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailRegex.test(email)){
        showMessage(
            "Enter a valid email"
        );
        return;
    }

    if(password.length < 8){
        showMessage(
            "Password must be at least 8 characters"
        );
        return;
    }

    if(!/[A-Z]/.test(password)){
        showMessage(
            "Password needs an uppercase letter"
        );
        return;
    }

    if(!/[0-9]/.test(password)){
        showMessage(
            "Password needs a number"
        );
        return;
    }

    if(
        !/^\d{6}$/.test(otp)
    ){
        showMessage(
            "Enter a valid 6 digit OTP"
        );
        return;
    }

    try{

        signupBtn.disabled = true;

        signupBtn.textContent =
        "Creating Account...";

        const res =
        await fetch(
            API + "/verify-otp",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    name,
                    email,
                    password,
                    otp
                })
            }
        );

        const data =
        await res.json();

        showMessage(
            data.message,
            data.success
        );

        if(data.success){

            localStorage.setItem(
                "token",
                data.token
            );

            setTimeout(() => {

                window.location.href =
                "dashboard.html";

            },1200);

        }

    }
    catch(error){

        showMessage(
            "Network error"
        );

    }
    finally{

        signupBtn.disabled = false;

        signupBtn.textContent =
        "Create Account";

    }

});

</script>

</body>
</html>
